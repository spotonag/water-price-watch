services:
  - type: web
    name: water-price-watch
    runtime: node
    plan: starter
    buildCommand: npm ci && npx playwright install --with-deps chromium
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: RURALCO_URL
        value: https://www.ruralcowater.com.au/home/
      - key: RURALCO_MARKET_LABEL
        value: TEMPORARY ALLOCATION MARKETS
      - key: RURALCO_STATE_LABEL
        value: VIC
      - key: RURALCO_ZONE_LABEL
        value: Vic Goulburn_Zone 1A
      - key: SMS_ENABLED
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: water-price-watch-db
          property: connectionString
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: ALERT_TO_NUMBER
        sync: false
      - key: APP_ACCESS_CODE
        sync: false

  - type: cron
    name: water-price-watch-checker
    runtime: node
    schedule: "*/30 * * * *"
    buildCommand: npm ci && npx playwright install --with-deps chromium
    startCommand: npm run check
    envVars:
      - key: NODE_ENV
        value: production
      - key: RURALCO_URL
        value: https://www.ruralcowater.com.au/home/
      - key: RURALCO_MARKET_LABEL
        value: TEMPORARY ALLOCATION MARKETS
      - key: RURALCO_STATE_LABEL
        value: VIC
      - key: RURALCO_ZONE_LABEL
        value: Vic Goulburn_Zone 1A
      - key: SMS_ENABLED
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: water-price-watch-db
          property: connectionString
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: ALERT_TO_NUMBER
        sync: false

# Change the database plan in Render if this exact plan name is not available in your account.
databases:
  - name: water-price-watch-db
    plan: starter
